[package]
name = "wasm-steam-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A Steam CM-protocol client that runs entirely in the browser (Rust/WASM): QR or password login and Web API auth-ticket minting for your own account, with no local Steam install"
repository = "https://github.com/Dhananjay-JSR/wasm-steam-client"

[dependencies]
protobuf = "3.5"
steam-vent-proto-steam = "0.5"
steam-vent-proto-common = "0.5"
flate2 = "1"           # pure-Rust (miniz_oxide) backend → wasm-safe; gunzips Multi payloads
rsa = "0.9"            # PKCS#1 v1.5 encrypt of the password; pure Rust
rand = "0.8"           # OsRng for the padding
base64 = "0.22"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }   # render the QR challenge as SVG
crc32fast = "1"       # CRC the auth ticket for ClientAuthList

# Browser transport (only used on the wasm32 target).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "BinaryType", "ErrorEvent", "CloseEvent", "Event"] }
getrandom = { version = "0.2", features = ["js"] }   # browser crypto backend for OsRng

[lib]
crate-type = ["cdylib", "rlib"]
